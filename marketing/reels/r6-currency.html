<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baytak Reel: Dollars or Lira</title>
<link rel="stylesheet" href="kit.css">
<style>
#h1 { top: 200px; animation: rise .5s var(--e-out) .1s both; }
#h1b { top: 300px; animation: rise .5s var(--e-out) 1s both; }
.zoom { position: absolute; left: 99px; width: 490px; transform: scale(1.8); transform-origin: 0 0; }
#usd { top: 520px; }
#lbp { top: 850px; }
#usd .card { animation: slideL .6s var(--e-out) .45s both; }
#lbp .card { animation: slideR .6s var(--e-out) .65s both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-120px) } to { opacity: 1; transform: none } }
@keyframes slideR { from { opacity: 0; transform: translateX(120px) } to { opacity: 1; transform: none } }
.slipcard .tot .cur { color: var(--ink); }
.plus { position: absolute; left: 485px; top: 720px; width: 110px; height: 110px; border-radius: 50%; background: var(--ink-soft); color: var(--ink); display: grid; place-items: center; font-size: 66px; z-index: 5; box-shadow: 0 8px 20px rgba(5,48,46,.18); }
.plus .ico { stroke-width: 2.4; }
#plus { --r: 0deg; animation: stampLand .45s linear 1.9s both, shake .4s linear 2.55s, fadeOut .25s ease 3.05s forwards; }
#nope { background: var(--ink); color: #fff; --r: 0deg; opacity: 0; animation: stampLand .4s linear 2.95s both, fadeOut .3s ease 3.6s forwards; }
.q { position: absolute; left: 620px; top: 735px; font-size: 64px; line-height: 80px; font-weight: 700; color: var(--text-faint); animation: fadeIn .2s ease 2.1s both, fadeOut .2s ease 2.95s forwards; }
.verdict { position: absolute; left: 72px; top: 1110px; width: 936px; }
.verdict div { font-size: 62px; line-height: 84px; color: var(--text-muted); white-space: nowrap; }
.verdict .num { font-size: 74px; color: var(--text); }
.verdict .cur { font-weight: 600; }
#v1 { animation: rise .45s var(--e-out) 3.55s both; }
#v2 { animation: rise .45s var(--e-out) 3.75s both; }
#say { top: 1310px; animation: rise .5s var(--e-out) 4.3s both; }
</style>
</head>
<body>
<div class="stage" id="stage" style="--end: 7s" role="img" aria-label="Reel: Dollars or lira? Both, never mixed. A 75 USD receipt and a 2,225,000 LBP receipt are never added together; Baytak shows You owe 75 USD and 2,225,000 LBP.">
  <h2 class="hook" id="h1">Dollars or lira?</h2>
  <h2 class="hook" id="h1b">Both. <em>Never mixed.</em></h2>
  <div class="zoom" id="usd">
    <div class="card slipcard">
      <div class="st"><span class="t-bs">Oct 1, 2026</span><span class="stamp unpaid"><svg class="ico"><use href="#i-ring"/></svg>Unpaid</span></div>
      <div class="div"></div>
      <div class="tot"><span class="t-bs">Total</span><span class="num">75 <span class="cur">USD</span></span></div>
    </div>
  </div>
  <div class="plus" id="plus"><svg class="ico"><use href="#i-plus"/></svg></div>
  <div class="plus" id="nope"><svg class="ico"><use href="#i-x"/></svg></div>
  <div class="q">= ?</div>
  <div class="zoom" id="lbp">
    <div class="card slipcard">
      <div class="st"><span class="t-bs">Sep 1, 2026</span><span class="stamp unpaid"><svg class="ico"><use href="#i-ring"/></svg>Unpaid</span></div>
      <div class="div"></div>
      <div class="tot"><span class="t-bs">Total</span><span class="num">2,225,000 <span class="cur">LBP</span></span></div>
    </div>
  </div>
  <div class="verdict"><div id="v1">You owe <span class="num">75</span><span class="cur"> USD</span></div><div id="v2">and <span class="num">2,225,000</span><span class="cur"> LBP</span></div></div>
  <p class="say" id="say">Every amount shows its currency. <b>Totals are never added together.</b></p>
</div>
<script src="kit.js"></script>
<script>
Kit.init({ title: 'Baytak Reel: dollars or lira', duration: 10 });
</script>
</body>
</html>
